<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信スケジュール作成ツール</title>

<style>
body { font-family: sans-serif; }
canvas { display:none; }
</style>
</head>
<body>

<h2>スケジュール作成</h2>
テンプレ: <select id="templateSelect"></select>

<div id="inputs"></div>

<button onclick="drawAll()">プレビュー</button>

<br><br>
<img id="previewImage" style="width:900px;">

<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* ================= テンプレ ================= */
const templates = {
sample:{
name:"テンプレ",
image:"./templates/t2m.png",
areas:[
{ x:100,y:331,width:305,height:268 },
{ x:475,y:331,width:305,height:268 },
{ x:850,y:331,width:305,height:268 },
{ x:49,y:727,width:305,height:268 },
{ x:424,y:727,width:305,height:268 },
{ x:799,y:727,width:305,height:268 },
{ x:1174,y:727,width:305,height:268 }
],
datePos:[
{ x:153,y:348 },
{ x:528,y:348 },
{ x:903,y:348 },
{ x:104,y:744 },
{ x:479,y:744 },
{ x:854,y:744 },
{ x:1229,y:744 }
]
}
};

/* ================= 画像 ================= */
function loadImg(src){
const img=new Image();
img.src=src;
return img;
}

const templateImage=new Image();

const icons={
youtube:loadImg("./icons/YouTube.png"),
iriam:loadImg("./icons/IRIAM.png"),
twitch:loadImg("./icons/Twitch.png")
};

/* ================= UI ================= */
const inputDiv=document.getElementById("inputs");

for(let i=0;i<7;i++){
inputDiv.innerHTML+=`
<div>
<h4>${i+1}日目</h4>

日付:
<input id="date_${i}"><br>

1件目:
<select id="icon1_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time1_${i}">
<input id="title1_${i}"><br>

2件目:
<input type="checkbox" id="enable2_${i}" onchange="toggle2(${i})">

<div id="block2_${i}" style="display:none;">
<select id="icon2_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time2_${i}">
<input id="title2_${i}"><br>

3件目:
<input type="checkbox" id="enable3_${i}" onchange="toggle3(${i})">

<div id="block3_${i}" style="display:none;">
<select id="icon3_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time3_${i}">
<input id="title3_${i}">
</div>
</div>

</div><hr>`;
}

/* ================= UI制御 ================= */
function toggle2(i){
const c=document.getElementById(`enable2_${i}`).checked;
document.getElementById(`block2_${i}`).style.display=c?"block":"none";

if(!c){
document.getElementById(`enable3_${i}`).checked=false;
document.getElementById(`block3_${i}`).style.display="none";
}
}

function toggle3(i){
const c=document.getElementById(`enable3_${i}`).checked;
document.getElementById(`block3_${i}`).style.display=c?"block":"none";
}

/* ================= データ ================= */
function getData(){
const data=[];
for(let i=0;i<7;i++){
const plans=[];

const t1=document.getElementById(`time1_${i}`).value;
const title1=document.getElementById(`title1_${i}`).value;
const icon1=document.getElementById(`icon1_${i}`).value;

if(t1&&title1){
plans.push({time:t1,title:title1,icon:icon1});
}

if(document.getElementById(`enable2_${i}`).checked){
const t2=document.getElementById(`time2_${i}`).value;
const title2=document.getElementById(`title2_${i}`).value;
const icon2=document.getElementById(`icon2_${i}`).value;

if(t2&&title2){
plans.push({time:t2,title:title2,icon:icon2});
}

if(document.getElementById(`enable3_${i}`).checked){
const t3=document.getElementById(`time3_${i}`).value;
const title3=document.getElementById(`title3_${i}`).value;
const icon3=document.getElementById(`icon3_${i}`).value;

if(t3&&title3){
plans.push({time:t3,title:title3,icon:icon3});
}
}
}

data.push({plans});
}
return data;
}

/* ================= 描画 ================= */
function setFont(size){
ctx.font=size+"px sans-serif";
ctx.fillStyle="#51242D";
}

function drawTextCenter(text,cx,y){
const w=ctx.measureText(text).width;
ctx.fillText(text,cx-w/2,y);
}

function drawIconText(icon,text,cx,y){
const w=ctx.measureText(text).width;
const total=40+6+w;
let x=cx-total/2;
ctx.drawImage(icons[icon],x,y-30,40,40);
ctx.fillText(text,x+46,y);
}

function drawSingle(area,p){
const cx=area.x+area.width/2;
setFont(42);
drawIconText(p.icon,p.time,cx,area.y+area.height*0.35);
drawTextCenter(p.title,cx,area.y+area.height*0.6);
}

function drawDouble(area,p){
const cx=area.x+area.width/2;
const mid=area.y+area.height/2;

ctx.beginPath();
ctx.moveTo(area.x+10,mid);
ctx.lineTo(area.x+area.width-10,mid);
ctx.stroke();

setFont(40);

drawIconText(p[0].icon,p[0].time,cx,area.y+area.height*0.3);
drawTextCenter(p[0].title,cx,area.y+area.height*0.5);

drawIconText(p[1].icon,p[1].time,cx,area.y+area.height*0.7);
drawTextCenter(p[1].title,cx,area.y+area.height*0.9);
}

function drawTriple(area,p){
const cx=area.x+area.width/2;

const l1=area.y+area.height*0.33;
const l2=area.y+area.height*0.66;

ctx.beginPath();
ctx.moveTo(area.x+10,l1);
ctx.lineTo(area.x+area.width-10,l1);
ctx.moveTo(area.x+10,l2);
ctx.lineTo(area.x+area.width-10,l2);
ctx.stroke();

setFont(34);

const y1=area.y+area.height*0.2;
const y2=area.y+area.height*0.5;
const y3=area.y+area.height*0.8;

drawIconText(p[0].icon,p[0].time,cx,y1);
drawTextCenter(p[0].title,cx,y1+40);

drawIconText(p[1].icon,p[1].time,cx,y2);
drawTextCenter(p[1].title,cx,y2+40);

drawIconText(p[2].icon,p[2].time,cx,y3);
drawTextCenter(p[2].title,cx,y3+40);
}

/* ================= 実行 ================= */
async function drawAll(){

ctx.clearRect(0,0,1920,1080);
ctx.drawImage(templateImage,0,0);

const data=getData();

data.forEach((d,i)=>{
const area=templates.sample.areas[i];

if(d.plans.length===1){
drawSingle(area,d.plans[0]);
}else if(d.plans.length===2){
drawDouble(area,d.plans);
}else if(d.plans.length===3){
drawTriple(area,d.plans);
}
});

document.getElementById("previewImage").src=
canvas.toDataURL("image/png");
}

templateImage.src="./templates/t2m.png";
</script>
</body>
</html>
