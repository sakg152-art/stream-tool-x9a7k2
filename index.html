<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信スケジュール作成ツール</title>

<style>
body { font-family: sans-serif; }
canvas { display:none; }

/* 入力幅85px */
input[id^="time"],
input[id^="title"],
input[id^="date"] {
  width: 85px;
}

@font-face {
  font-family: "DateFont";
  src: url("./fonts/KaiseiDecol-Bold.ttf");
}

@font-face {
  font-family: "MainFont";
  src: url("./fonts/bokutachi.otf");
}
</style>
</head>
<body>

<h2>スケジュール作成</h2>
テンプレ: <select id="templateSelect"></select>

<div id="inputs"></div>

<!-- ▼備考欄UI追加 -->
<label>
<input type="checkbox" id="enableNote">
備考欄を表示
</label>
<br>

<textarea id="noteText" rows="4" style="width:400px;"></textarea>

<br>
文字サイズ:
<input type="number" id="noteFontSize" value="42" style="width:60px;">

<br> 行間:
<input type="number" id="noteLineHeight" value="8" style="width:60px;">

<br> 字間:
<input type="number" id="noteLetterSpacing" value="0" step="0.5" style="width:60px;">
<br><br>

<button onclick="drawAll()">プレビュー</button>

<br><br>
<img id="previewImage" style="width:900px;">

<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* ================= テンプレ ================= */
const templates = {
sample:{
name:"2月テンプレ",
image:"./templates/t2m.png",
areas:[
{ x:100,y:331,width:305,height:268 },
{ x:475,y:331,width:305,height:268 },
{ x:850,y:331,width:305,height:268 },
{ x:49,y:727,width:305,height:268 },
{ x:424,y:727,width:305,height:268 },
{ x:799,y:727,width:305,height:268 },
{ x:1174,y:727,width:305,height:268 }
],
datePos:[
{ x:153,y:348 },
{ x:528,y:348 },
{ x:903,y:348 },
{ x:104,y:744 },
{ x:479,y:744 },
{ x:854,y:744 },
{ x:1229,y:744 }
],
noteArea:{ x:1188, y:261, width:382, height:422 }
},

sample3:{
name:"3月テンプレ",
image:"./templates/t3m.png",
areas:[
{ x:100,y:331,width:305,height:268 },
{ x:475,y:331,width:305,height:268 },
{ x:850,y:331,width:305,height:268 },
{ x:49,y:727,width:305,height:268 },
{ x:424,y:727,width:305,height:268 },
{ x:799,y:727,width:305,height:268 },
{ x:1174,y:727,width:305,height:268 }
],
datePos:[
{ x:153,y:348 },
{ x:528,y:348 },
{ x:903,y:348 },
{ x:104,y:744 },
{ x:479,y:744 },
{ x:854,y:744 },
{ x:1229,y:744 }
],
noteArea:{ x:1188, y:261, width:382, height:422 }
}
};

/* ================= テンプレ選択 ================= */
const select = document.getElementById("templateSelect");

Object.keys(templates).forEach(key=>{
const op=document.createElement("option");
op.value=key;
op.textContent=templates[key].name;
select.appendChild(op);
});

let currentTemplate = templates.sample;
const templateImage = new Image();

select.onchange=()=>{
currentTemplate = templates[select.value];
templateImage.src = currentTemplate.image;
};

templateImage.src = currentTemplate.image;

/* ================= 画像 ================= */
function loadImg(src){
const img=new Image();
img.src=src;
return img;
}

const icons={
youtube:loadImg("./icons/YouTube.png"),
iriam:loadImg("./icons/IRIAM.png"),
twitch:loadImg("./icons/Twitch.png")
};

/* ▼備考枠画像追加 */
const noteFrame = loadImg("./templates/note_frame.png");

/* ================= UI ================= */
const inputDiv=document.getElementById("inputs");

for(let i=0;i<7;i++){
inputDiv.innerHTML+=`
<div>
<h4>${i+1}日目</h4>

<label>
<input type="checkbox" id="off_${i}" onclick="toggleOff(${i})">
配信なし
</label>
<br>

<div id="planBlock_${i}">

日付:
<input id="date_${i}"><br>

1件目:
<select id="icon1_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time1_${i}">
<input id="title1_${i}"><br>

2件目:
<input type="checkbox" id="enable2_${i}" onclick="toggle2(${i})">

<div id="block2_${i}" style="display:none;">
<select id="icon2_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time2_${i}">
<input id="title2_${i}"><br>

3件目:
<input type="checkbox" id="enable3_${i}" onclick="toggle3(${i})">

<div id="block3_${i}" style="display:none;">
<select id="icon3_${i}">
<option value="youtube">YouTube</option>
<option value="iriam">IRIAM</option>
<option value="twitch">Twitch</option>
</select>
<input id="time3_${i}">
<input id="title3_${i}">
</div>
</div>

</div>

</div><hr>`;
}

/* ================= UI制御 ================= */
function toggleOff(i){
const checked = document.getElementById(`off_${i}`).checked;
document.getElementById(`planBlock_${i}`).style.display =
checked ? "none" : "block";
}

function toggle2(i){
const c=document.getElementById(`enable2_${i}`).checked;
const block2=document.getElementById(`block2_${i}`);

block2.style.display=c?"block":"none";

if(!c){
document.getElementById(`enable3_${i}`).checked=false;
document.getElementById(`block3_${i}`).style.display="none";
}
}

function toggle3(i){
const c=document.getElementById(`enable3_${i}`).checked;
document.getElementById(`block3_${i}`).style.display=
c?"block":"none";
}

/* ================= データ ================= */
function getData(){
const data=[];
for(let i=0;i<7;i++){

const plans=[];
const off = document.getElementById(`off_${i}`).checked;
const date = document.getElementById(`date_${i}`).value;

const t1=document.getElementById(`time1_${i}`).value;
const title1=document.getElementById(`title1_${i}`).value;
const icon1=document.getElementById(`icon1_${i}`).value;

if(t1&&title1){
plans.push({time:t1,title:title1,icon:icon1});
}

if(document.getElementById(`enable2_${i}`).checked){
const t2=document.getElementById(`time2_${i}`).value;
const title2=document.getElementById(`title2_${i}`).value;
const icon2=document.getElementById(`icon2_${i}`).value;

if(t2&&title2){
plans.push({time:t2,title:title2,icon:icon2});
}

if(document.getElementById(`enable3_${i}`).checked){
const t3=document.getElementById(`time3_${i}`).value;
const title3=document.getElementById(`title3_${i}`).value;
const icon3=document.getElementById(`icon3_${i}`).value;

if(t3&&title3){
plans.push({time:t3,title:title3,icon:icon3});
}
}
}

data.push({plans, off, date});
}
return data;
}

/* ================= 描画 ================= */
function setDateFont(size=40){
  ctx.font = size + "px DateFont";
  ctx.fillStyle = "#51242D";
}

function setMainFont(size=42){
  ctx.font = size + "px MainFont";
  ctx.fillStyle = "#51242D";
}

function drawTextFit(text,cx,y){
const w=ctx.measureText(text).width;
ctx.fillText(text,cx-w/2,y);
}

function drawIconText(icon,text,cx,y){
const w=ctx.measureText(text).width;
const total=40+6+w;
let x=cx-total/2;
ctx.drawImage(icons[icon],x,y-30,40,40);
ctx.fillText(text,x+46,y);
}

function drawSingle(area,p){
const cx=area.x+area.width/2;
setMainFont(42);
drawIconText(p.icon,p.time,cx,area.y+area.height*0.35);
drawTextFit(p.title,cx,area.y+area.height*0.6);
}

function drawDouble(area,p){
const cx=area.x+area.width/2;
const mid=area.y+area.height/2;

ctx.beginPath();
ctx.moveTo(area.x+10,mid);
ctx.lineTo(area.x+area.width-10,mid);
ctx.stroke();

setMainFont(42);

drawIconText(p[0].icon,p[0].time,cx,area.y+area.height*0.3);
drawTextFit(p[0].title,cx,area.y+area.height*0.5);

drawIconText(p[1].icon,p[1].time,cx,area.y+area.height*0.7);
drawTextFit(p[1].title,cx,area.y+area.height*0.9);
}

function drawTriple(area,p){
const cx=area.x+area.width/2;

const l1=area.y+area.height*0.33;
const l2=area.y+area.height*0.66;

ctx.beginPath();
ctx.moveTo(area.x+10,l1);
ctx.lineTo(area.x+area.width-10,l1);
ctx.moveTo(area.x+10,l2);
ctx.lineTo(area.x+area.width-10,l2);
ctx.stroke();

setMainFont(42);

const y1=area.y+area.height*0.2;
const y2=area.y+area.height*0.5;
const y3=area.y+area.height*0.8;

drawIconText(p[0].icon,p[0].time,cx,y1);
drawTextFit(p[0].title,cx,y1+40);

drawIconText(p[1].icon,p[1].time,cx,y2);
drawTextFit(p[1].title,cx,y2+40);

drawIconText(p[2].icon,p[2].time,cx,y3);
drawTextFit(p[2].title,cx,y3+40);
}

function drawOff(area){
setMainFont(42);
const text="おやすみ";
const x=area.x+area.width/2;
const y=area.y+area.height*0.4;
const w=ctx.measureText(text).width;
ctx.fillText(text,x-w/2,y);
}

/* ▼備考描画追加 */
function drawNote(area,text,fontSize,lineGap,letterSpacing){
ctx.drawImage(noteFrame,area.x,area.y,area.width,area.height);

setMainFont(fontSize);

const centerX=area.x+area.width/2.15;
let y=area.y+area.height/1.7;

const lines=text.split("\n");
const totalHeight=lines.length*(fontSize+lineGap)-lineGap;
y-=totalHeight/2;

lines.forEach(line=>{
let lineWidth=0;
for(let c of line){
lineWidth+=ctx.measureText(c).width+letterSpacing;
}

let x=centerX-lineWidth/2;

for(let c of line){
ctx.fillText(c,x,y);
x+=ctx.measureText(c).width+letterSpacing;
}

y+=fontSize+lineGap;
});
}

/* ================= 実行 ================= */
async function drawAll(){

await document.fonts.ready;

ctx.clearRect(0,0,1920,1080);
ctx.drawImage(templateImage,0,0);

const data=getData();

data.forEach((d,i)=>{
const area=currentTemplate.areas[i];

/* 日付は常に表示 */
if(d.date){
setDateFont(40);
const pos=currentTemplate.datePos[i];
ctx.fillText(d.date,pos.x,pos.y);
}

if(d.off){
drawOff(area);
return;
}

if(d.plans.length===1){
drawSingle(area,d.plans[0]);
}else if(d.plans.length===2){
drawDouble(area,d.plans);
}else if(d.plans.length===3){
drawTriple(area,d.plans);
}
});

/* ▼備考処理追加 */
const noteEnabled = document.getElementById("enableNote").checked;
const noteText = document.getElementById("noteText").value;

const noteFontSize =
Number(document.getElementById("noteFontSize").value) || 42;
const noteLineHeight =
Number(document.getElementById("noteLineHeight").value) || 8;
const noteLetterSpacing =
Number(document.getElementById("noteLetterSpacing").value) || 0;

if(noteEnabled && currentTemplate.noteArea){
drawNote(
currentTemplate.noteArea,
noteText,
noteFontSize,
noteLineHeight,
noteLetterSpacing
);
}

document.getElementById("previewImage").src=
canvas.toDataURL("image/png");
}
</script>
</body>
</html>
